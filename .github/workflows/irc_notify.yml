# send build notifications to the #mapserver IRC channel
# homepage: https://github.com/marketplace/actions/notify-irc

name: "IRC Push Notification"
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened]
    branches:
      - main
  # run on tag creation
  create:

permissions:
  contents: read

jobs:
  irc_notify:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: irc push
        uses: rectalogic/notify-irc@v2
        if: github.event_name == 'push'
        with:
          channel: "#mapserver"
          server: "irc.libera.chat"
          nickname: mapserver-github-notifier
          message: |
            ${{ github.actor }} pushed ${{ github.event.ref }} ${{ github.event.compare }}
            ${{ join(github.event.commits.*.message) }}
      - name: irc pull request
        uses: rectalogic/notify-irc@v2
        if: github.event_name == 'pull_request'
        with:
          channel: "#mapserver"
          server: "irc.libera.chat"
          nickname: mapserver-github-notifier
          message: |
            ${{ github.actor }} opened PR ${{ github.event.pull_request.html_url }}
            ${{ github.event.pull_request.title }}
      - name: irc tag created
        uses: rectalogic/notify-irc@v2
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        with:
          channel: "#mapserver"
          server: "irc.libera.chat"
          nickname: mapserver-github-notifier
          message: |
            ${{ github.actor }} tagged ${{ github.repository }} ${{ github.event.ref }}
      - name: Report IRC failure
        if: failure()
        run: echo "::warning::IRC notification to #mapserver failed"
